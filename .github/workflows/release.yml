# Baut eine signierte APK und veröffentlicht sie als GitHub Release
# (Tag vX.Y.Z wird dabei automatisch angelegt) – dort findet Obtainium die Updates.
#
# Auslöser: Änderung der Datei VERSION auf main, oder manuell unter
# Actions → Release → "Run workflow".
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Version aus der Datei VERSION lesen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION muss das Format X.Y.Z haben, ist aber '$NAME'" >&2
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          if gh release view "v$NAME" > /dev/null 2>&1; then
            echo "Release v$NAME existiert bereits – bitte VERSION erhöhen." >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Signaturschlüssel bereitstellen
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Secret SIGNING_KEYSTORE_BASE64 fehlt" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signierte APK bauen
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk \
            "first-light-${{ steps.version.outputs.name }}.apk"

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "first-light-${{ steps.version.outputs.name }}.apk"

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            "first-light-${{ steps.version.outputs.name }}.apk" \
            --target "$GITHUB_SHA" \
            --title "First Light ${{ steps.version.outputs.name }}" \
            --generate-notes
